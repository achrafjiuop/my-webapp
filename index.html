<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم بوت التحميل</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-top: 20px;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background-color: #3b82f6;
            color: white;
        }
        .btn-danger {
            background-color: #ef4444;
            color: white;
        }
        #result {
            margin-top: 15px;
            padding: 10px;
            background: #0f172a;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>لوحة تحكم البوت</h2>
        <p style="text-align: center; font-size: 13px; color: #94a3b8;">أدخل رابط الوسائط للبدء في المعالجة والتحميل</p>
        
        <input type="text" id="urlInput" placeholder="أدخل الرابط هنا (يوتيوب، انستغرام...)...">
        
        <div class="btn-group">
            <button class="btn-primary" onclick="startDownload()">تحميل</button>
            <button class="btn-danger" onclick="clearInput()">مسح</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        function startDownload() {
            const inputVal = document.getElementById('urlInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (inputVal === "") {
                alert("المرجو إدخال رابط صحيح أولاً!");
                return;
            }

            resultDiv.style.display = "block";
            resultDiv.style.color = "#38bdf8";
            resultDiv.innerHTML = "جاري معالجة الطلب وإرساله للبوت...";

            // محاكاة الاتصال الفعلي أو إرسال الطلب
            setTimeout(() => {
                resultDiv.style.color = "#22c55e";
                resultDiv.innerHTML = "تم إرسال الطلب بنجاح! سيتم بدء التحميل قريباً.";
            }, 1500);
        }

        function clearInput() {
            document.getElementById('urlInput').value = "";
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = "none";
            resultDiv.innerHTML = "";
        }
    </script>

</body>
</html>
