<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم بوت التحميل الشامل</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #ffffff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-top: 20px; }
        h2 { text-align: center; color: #38bdf8; }
        input[type="text"] { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background-color: #3b82f6; color: white; margin-top: 10px; }
        #result { margin-top: 15px; padding: 10px; background: #0f172a; border-radius: 8px; text-align: center; display: none; word-break: break-all; }
        video { width: 100%; margin-top: 10px; border-radius: 8px; outline: none; }
        a.download-link { display: block; margin-top: 10px; padding: 10px; background: #22c55e; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>لوحة تحميل الوسائط</h2>
        <input type="text" id="urlInput" placeholder="ألصق رابط الفيديو أو الملف هنا...">
        <button onclick="fetchDownloadLink()">جلب الوسائط</button>
        
        <div id="result">
            <div id="statusText"></div>
            <video id="mediaPlayer" controls style="display: none;"></video>
            <div id="downloadContainer"></div>
        </div>
    </div>

    <script>
        async function fetchDownloadLink() {
            const url = document.getElementById('urlInput').value.trim();
            const resultDiv = document.getElementById('result');
            const statusText = document.getElementById('statusText');
            const mediaPlayer = document.getElementById('mediaPlayer');
            const downloadContainer = document.getElementById('downloadContainer');

            if (!url) {
                alert("المرجو إدخال الرابط أولاً!");
                return;
            }

            resultDiv.style.display = "block";
            statusText.style.color = "#38bdf8";
            statusText.innerHTML = "جاري الاتصال بالسيرفر ومعالجة الفيديو...";
            mediaPlayer.style.display = "none";
            downloadContainer.innerHTML = "";

            try {
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (data.status === 'stream' || data.status === 'redirect' || data.url) {
                    const downloadUrl = data.url || data.stream;
                    statusText.style.color = "#22c55e";
                    statusText.innerHTML = "تم تجهيز الفيديو بنجاح!";

                    mediaPlayer.src = downloadUrl;
                    mediaPlayer.style.display = "block";

                    downloadContainer.innerHTML = `<a class="download-link" href="${downloadUrl}" target="_blank" download>تحميل الفيديو (تنزيل مباشر)</a>`;
                } else {
                    statusText.style.color = "#ef4444";
                    statusText.innerHTML = "فشل في معالجة الرابط، تأكد أنه مدعوم.";
                }
            } catch (err) {
                statusText.style.color = "#ef4444";
                statusText.innerHTML = "حدث خطأ في الاتصال بالسيرفر الخارجي.";
            }
        }
    </script>
</body>
</html>
