<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الفيديوهات - Mini App</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
            background: #334155;
            color: white;
            text-align: center;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎬 بوت التحميل</h2>
        <p>أدخل رابط الفيديو للتحميل المباشر</p>
        <input type="text" id="videoUrl" placeholder="أصق الرابط هنا...">
        <br>
        <button onclick="startDownload()">تحميل الآن</button>
    </div>

    <script>
        function startDownload() {
            const url = document.getElementById('videoUrl').value;
            if(!url) {
                alert('الرجاء إدخال رابط صالح!');
                return;
            }
            alert('جاري معالجة الرابط: ' + url);
        }
    </script>

</body>
</html>
